name: Publish RP-01 test release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-rp01-test.yml']

permissions:
  contents: read

concurrency:
  group: publish-rp01-test
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'shehab4546/RatchetPort' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify provenance and publish the reviewed RP-01 artifacts
        shell: python
        run: |
          import hashlib
          import json
          import pathlib
          import subprocess
          import zipfile

          repo = 'shehab4546/RatchetPort'
          run_id = 39822653784
          tested = '548454aec57c5521d9f44c5acb13208fc0a9046b'
          merged = '3cc2a50d5f4fb81550994b858ad3df3e310cb743'
          head = 'ad79d74ccf73df8451f3de4c750fe60b2bbfb132'
          tag = 'rp01-test-1'
          release_title = 'RatchetPort V1.2 — Baseline Preview'

          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)

          def api(path):
              return json.loads(gh('api', 'repos/' + repo + '/' + path))

          # An existing release needs only a title update; preserve its assets and notes.
          existing_release = subprocess.run(
              ['gh', 'api', 'repos/' + repo + '/releases/tags/' + tag],
              capture_output=True, text=True)
          if existing_release.returncode == 0:
              release = json.loads(existing_release.stdout)
              assert release['target_commitish'] == merged and release['prerelease']
              assert not release['draft']
              gh('release', 'edit', tag, '--repo', repo, '--title', release_title)
              raise SystemExit(0)

          run = api(f'actions/runs/{run_id}')
          assert run['conclusion'] == 'success' and run['status'] == 'completed'
          assert run['head_sha'] == head and run['event'] == 'pull_request'
          assert run['path'] == '.github/workflows/windows-zip.yml'
          jobs = api(f'actions/runs/{run_id}/jobs')['jobs']
          assert all(any(j['name'] == name and j['conclusion'] == 'success' for j in jobs)
                     for name in ('build', 'smoke'))
          tested_tree = api('git/commits/' + tested)['tree']['sha']
          assert tested_tree == api('git/commits/' + merged)['tree']['sha']
          pr = api('pulls/1')
          assert pr['merged'] and pr['merge_commit_sha'] == merged
          artifacts = api(f'actions/runs/{run_id}/artifacts')['artifacts']
          names = [f'RatchetPort-Windows-PlayGo-{tested}', f'RatchetPort-PlayGo-source-{tested}']
          for name in names:
              matches = [a for a in artifacts if a['name'] == name and not a['expired']]
              assert len(matches) == 1
              gh('run', 'download', str(run_id), '--repo', repo, '--name', name, '--dir', 'incoming')

          incoming = pathlib.Path('incoming')
          output = pathlib.Path('release')
          output.mkdir()
          mapping = {
              'RatchetPort-Windows-PreAlpha.zip': 'RatchetPort-Windows-RP01-Test1.zip',
              'RatchetPort-V1.1-PlayGo-Source.zip': 'RatchetPort-RP01-Test1-Source.zip',
              'ffmpeg-9.0.2.tar.xz': 'ffmpeg-9.0.2.tar.xz',
          }
          assets = []
          for source, destination in mapping.items():
              matches = list(incoming.rglob(source))
              assert len(matches) == 1, (source, matches)
              data = matches[0].read_bytes()
              assert data
              target = output / destination
              target.write_bytes(data)
              assets.append(target)
          with zipfile.ZipFile(output / 'RatchetPort-RP01-Test1-Source.zip') as archive:
              assert archive.testzip() is None
              revision = archive.read('RatchetPort-V1.1-PlayGo/SOURCE_REVISION.txt').decode().strip()
              assert revision == tested
          with zipfile.ZipFile(output / 'RatchetPort-Windows-RP01-Test1.zip') as archive:
              assert archive.testzip() is None
          provenance = {
              'release_commit': merged, 'build_commit': tested, 'source_tree': tested_tree,
              'pull_request': 1, 'workflow_run': run_id,
              'workflow_url': f'https://github.com/{repo}/actions/runs/{run_id}',
              'gameplay_acceptance': 'pending owner testing',
              'note': 'Original CI ZIP contents are unchanged. The PR test merge and main merge have identical Git trees.',
          }
          provenance_path = output / 'BUILD_PROVENANCE.json'
          provenance_path.write_text(json.dumps(provenance, indent=2) + '\n')
          assets.append(provenance_path)
          sums = output / 'SHA256SUMS.txt'
          sums.write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n'
                                  for p in sorted(assets)))
          assets.append(sums)
          notes = pathlib.Path('release-notes.md')
          notes.write_text('''RP-01 baseline test build for CUSA01047 USA 01.00.

          Changes: tracked churn-trace analyzer, regression cases for incomplete/inconsistent traces, Windows CI coverage, and baseline documentation. PR #1 is merged.

          Validation: Windows build, Python checks, Liverpool harness, PlayGo/services/churn checks, packaging and package smoke test without MSYS2 passed in the linked CI run. Other native test results and explicit skips are documented in docs/RP01_BASELINE.md; they are not all rerun by this CI workflow.

          These are the unchanged artifacts from CI run 39822653784. They were built at PR test merge 548454aec57c5521d9f44c5acb13208fc0a9046b, whose entire source tree is identical to main merge 3cc2a50d5f4fb81550994b858ad3df3e310cb743. Internal archive names and source metadata retain their original labels. See BUILD_PROVENANCE.json and SHA256SUMS.txt.

          Owner test: extract to a new folder; retain the previous release and back up saves. Select your own CUSA01047 USA 1.00 dump. Start with the original game settings, a 30 FPS cap, VSync on, deferred readback off and zero-clear mirror off. Record GPU, driver, monitor refresh rate and settings. Play a repeatable route for about 30 minutes including movement, camera, jumping, combat, music/effects/dialogue, a cutscene, and save/load after restarting. Record tearing and cutscene stutters separately, with scene name/time and logs; compare against V1.1 using the same settings.

          Gameplay, audible audio and save/load acceptance remain pending. This release does not add 60 FPS, internal-resolution patches, motion-blur switches, control remapping or a dedicated tearing/cutscene-stutter fix. No game data is included. This is a separate prerelease and does not replace V1 or V1.1.
          '''.replace('          ', ''))
          # Refuse replacement of an existing release or its assets.
          existing = subprocess.run(['gh', 'release', 'view', tag, '--repo', repo],
                                    stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          if existing.returncode == 0:
              raise SystemExit('Release already exists; refusing to replace it.')
          gh('release', 'create', tag, *map(str, assets), '--repo', repo,
             '--target', merged, '--title', release_title,
             '--notes-file', str(notes), '--prerelease', '--latest=false')
