# Windows pre-alpha build and package checks. Does not replace or publish releases.
name: Windows zip

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'run.py'
      - 'src/**'
      - 'scripts/**'
      - 'launcher/**'
      - 'tests/**'
      - 'gpu/**'
      - 'build.sh'
      - 'packaging/windows/**'
      - '.github/workflows/windows-zip.yml'
  pull_request:
    paths:
      - 'run.py'
      - 'src/**'
      - 'scripts/**'
      - 'launcher/**'
      - 'tests/**'
      - 'gpu/**'
      - 'build.sh'
      - 'packaging/windows/**'
      - '.github/workflows/windows-zip.yml'
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The runner's Git turns LF into CRLF, and the FSR-Vulkan patches then no longer apply.
      - name: Keep LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The runner's C:/msys64, where msys2-env.sh and package.sh look for the CLANG64 DLLs.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
          update: true
          install: git patch
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p python:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p fmt:p boost:p robin-map:p xxhash:p ffmpeg:p zydis:p
            spirv-tools:p spirv-headers:p spirv-cross:p
      - name: Build
        run: |
          bash build.sh
          cmake --build out/ratchet-clean --target playgo-resolver-test services-test churn-trace-test verified-patches-test graphics-settings-test adaptive-gc-test pad-map-test audio-downmix-test resolution-diagnostics-test frame-capture-test --parallel 3
          out/ratchet-clean/resolution-diagnostics-test.exe
          RATCHET_RESOLUTION_DIAGNOSTICS=0 out/ratchet-clean/resolution-diagnostics-test.exe disabled
          out/ratchet-clean/frame-capture-test.exe
          out/ratchet-clean/adaptive-gc-test.exe
          out/ratchet-clean/pad-map-test.exe
          out/ratchet-clean/audio-downmix-test.exe
          out/ratchet-clean/graphics-settings-test.exe
          out/ratchet-clean/verified-patches-test.exe
          out/ratchet-clean/services-test.exe
          RATCHET_PLAYGO_TEST="$PWD/out/ratchet-clean/playgo-resolver-test.exe" python -m unittest discover -s tests -p 'test_playgo.py'
          python tests/test_texture_churn_trace.py "$PWD/out/ratchet-clean/churn-trace-test.exe"

      - name: Build LGPL release libraries
        run: |
          pacman -S --needed --noconfirm make nasm diffutils
          bash packaging/windows/build-ffmpeg.sh
      # Freezes the launcher; this Python ships Tk, as the python.org one does. Set up after the
      # build so its Python_ROOT_DIR and PKG_CONFIG_PATH do not reach CMake.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Python tests and package
        shell: pwsh
        run: |
          $env:PATH = $env:PATH + ";C:\msys64\clang64\bin"
          $env:RATCHET_PATCH_TEST = (Resolve-Path out/ratchet-clean/verified-patches-test.exe).Path
          $env:RATCHET_PLAYGO_TEST = (Resolve-Path out/ratchet-clean/playgo-resolver-test.exe).Path
          python -m venv out/ratchet-tools
          out/ratchet-tools/Scripts/python.exe -m pip install -r packaging/windows/requirements.txt
          out/ratchet-tools/Scripts/python.exe -m unittest discover -s tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/ratchet-tools/Scripts/python.exe tests/test_liverpool_commands.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/ratchet-tools/Scripts/python.exe packaging/windows/package.py --build-dir out/ratchet-clean
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          out/ratchet-tools/Scripts/python.exe packaging/windows/source_archive.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: RatchetPort-Windows-${{ github.sha }}
          path: dist/*-Windows.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RatchetPort-source-${{ github.sha }}
          path: |
            dist/*-Source.zip
            out/release-sources/ffmpeg-9.0.2.tar.xz
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RatchetPort-Windows-${{ github.sha }}
          path: dist
      - name: Open the package without MSYS2
        shell: powershell
        run: |
          $packages = @(Get-ChildItem dist/*-Windows.zip)
          if ($packages.Count -ne 1) { throw "Expected one Windows package" }
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/smoke-test.ps1 $packages[0].FullName
