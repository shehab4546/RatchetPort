# Experimental inherited Linux build; not part of the Windows Pre-Alpha release.
name: Linux AppImage

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: bash packaging/linux/ci-deps.sh
      - name: Build
        run: bash build.sh
      - name: AppImage
        run: |
          PATH="$PWD/out/venv/bin:$PATH" bash packaging/linux/build.sh
          cd dist && sha256sum ratchetport-x86_64.AppImage | sed 's/  / */' > ratchetport-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ratchetport-x86_64.AppImage
          path: dist/ratchetport-x86_64.AppImage*
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # debian:13 has SteamOS 3.7's glibc (2.41), fedora:42 is Bazzite's base.
        image: ['debian:13', 'fedora:42', 'ubuntu:24.04', 'archlinux:latest',
                'opensuse/tumbleweed:latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ratchetport-x86_64.AppImage
          path: dist
      - name: Open the launcher on ${{ matrix.image }}
        run: |
          chmod +x dist/ratchetport-x86_64.AppImage
          docker run --rm -v "$PWD:/w:ro" "${{ matrix.image }}" bash /w/packaging/linux/smoke-test.sh /w/dist/ratchetport-x86_64.AppImage
